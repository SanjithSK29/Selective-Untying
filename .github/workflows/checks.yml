name: Correctness and results
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -v
      - run: python report_results.py --output runs/ci-report
      - run: python report_results.py --results results.json --scaling results_gradscale.json --output runs/ci-exploratory
